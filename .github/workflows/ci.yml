# Backend (Node) test suite and webui (Next.js/TypeScript) build checks.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22+ is required: core/Database.js uses the built-in
      # `node:sqlite` module ("Uses Node.js 22+ built-in synchronous SQLite
      # (node:sqlite) for zero external compilation dependencies").
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci"
            npm ci
          else
            echo "No package-lock.json found — falling back to npm install"
            npm install
          fi

      - name: Run tests
        run: npm test

  webui-build:
    name: Webui build (Next.js/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci"
            npm ci
          else
            echo "No package-lock.json found — falling back to npm install"
            npm install
          fi

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
