# Gradle 8.7 is the minimum for Android Gradle Plugin 8.5.x.
#
# NOTE: gradle-wrapper.jar is a binary and is deliberately NOT committed here.
# Run `gradle wrapper` once in this directory (or simply open the project in
# Android Studio, which regenerates it) to create gradle/wrapper/gradle-wrapper.jar
# plus the `gradlew` / `gradlew.bat` launchers. See README.md.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
